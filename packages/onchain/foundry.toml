# Fork tests of the Base onchain cap (EVM-6). The TypeScript tests live in test/, these in forge/.
[profile.default]
src = "forge"
test = "forge"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.26"
# The signing page's calldata, which SigningPageKill.t.sol runs on a fork.
fs_permissions = [{ access = "read", path = "./forge/fixtures" }]
