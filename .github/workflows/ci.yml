name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # A probe of a public endpoint, not of our code: kept apart so an RPC outage does not fail the
  # code job. simulate() on Base needs eth_simulateV1, which not every provider serves.
  base-rpc:
    name: eth_simulateV1 on Base Sepolia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: check:simulate
        working-directory: packages/onchain
        env:
          BASE_RPC_URL: https://sepolia.base.org
        run: pnpm check:simulate

  # The owner's signing page (ADR 003) in a real Chromium, with Phantom faked. Kept out of
  # `pnpm test`: it needs a browser, and it is the page the owner trusts with the kill.
  signing-page:
    name: signing page (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx --prefix packages/onchain playwright install --with-deps chromium

      - name: test:web
        run: pnpm --filter @agentguard/onchain test:web

  # The deployable images, built from the repo root as `fly deploy` builds them. Decoy secrets are
  # planted first: if any reaches an image, the root .dockerignore has a hole.
  images:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plant decoy secrets
        run: |
          for f in .env packages/telegram-bot/.env packages/guard-core/.env.local e2e/.env; do
            echo DECOY_SECRET > "$f"
          done
          echo '[1,2,3]' > packages/guard-core/hot-keypair.json

      - name: Build the bot image
        run: docker build -f packages/telegram-bot/Dockerfile -t agentguard-bot .

      # The shell exits non-zero on a find, and docker run itself fails if the image cannot start, so a
      # broken check cannot pass by accident.
      - name: No decoy in the image
        run: |
          docker run --rm --entrypoint sh agentguard-bot -c '
            if grep -rlq DECOY_SECRET / --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev 2>/dev/null; then
              echo "a planted .env reached the image"; exit 1
            fi
            if find / -name "*keypair*.json" -not -path "/proc/*" 2>/dev/null | grep -q .; then
              echo "a planted keypair reached the image"; exit 1
            fi
            echo "no decoy in the image"'

  foundry:
    name: forge test (onchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        working-directory: packages/onchain
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          if [ ! -f foundry.toml ]; then
            echo "::notice::No Foundry project yet (owner: onchain, task ON-6). Skipping."
            exit 0
          fi
          forge --version
          forge test -vvv
